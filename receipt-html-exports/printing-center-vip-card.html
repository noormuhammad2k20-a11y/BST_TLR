<!DOCTYPE html>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

        @media print {

<body style="background: #e2e8f0; padding: 40px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;">

    <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 40px; background: #000;"></div>
    
    <div class="flex justify-between items-start z-10 relative" style="display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; position: relative;">

        <div class="text-lg font-bold leading-tight" style="font-size: 18px; font-weight: bold; line-height: 1.25;">BEST TAILOR</div>

    </div>
    <i class="fa-solid fa-scissors text-2xl opacity-30" style="font-size: 24px; opacity: 0.3;"></i>
    </div>

    <div class="text-[10px] uppercase tracking-wider opacity-80" style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.8;">Cardholder</div>
    <div class="text-xl font-semibold tracking-wide" style="font-size: 20px; font-weight: 600; letter-spacing: 0.025em;">John Doe</div>
    <div class="text-xs opacity-90 mt-1" style="font-size: 12px; opacity: 0.9; margin-top: 4px;">ID: VIP-2023-899 | Since: Jan 2023</div>
    </div>
    <div class="z-10 relative flex justify-between items-end" style="z-index: 10; position: relative; display: flex; justify-content: space-between; align-items: flex-end;">
    <div class="text-[10px] opacity-80" style="font-size: 10px; opacity: 0.8;">www.besttailor.com</div>
    <div class="w-16 h-8 bg-white/20 rounded flex items-center justify-center text-[8px] tracking-widest" style="width: 64px; height: 32px; background: rgba(255,255,255,0.2); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 8px; letter-spacing: 0.1em;">||| | || ||</div>
    </div>
