<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>58mm Thermal Receipt</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        
        @media print {
            body { background: white !important; padding: 0 !important; }
        }
    </style>
</head>
<body style="background: #e2e8f0; padding: 40px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;">
    
<div class="printable-area thermal-paper mx-auto" style="box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 4px; overflow: hidden; font-family: 'Courier New', monospace; padding: 16px 12px; width: 220px; background: #FAFAFA; color: #000; margin: 0 auto;">
    <div class="text-center font-bold text-sm" style="text-align: center; font-weight: bold; font-size: 14px;">BEST TAILOR</div>
    <div class="text-center text-[9px]" style="text-align: center; font-size: 9px;">Premium Bespoke Services</div>
    <div class="text-center text-[9px]" style="text-align: center; font-size: 9px;">0300-1234567</div>
    <div class="dashed-line" style="border-top: 1px dashed #000; margin: 8px 0; opacity: 0.7;"></div>
    <div class="text-[10px]" style="font-size: 10px;">Order: ORD-1001</div>
    <div class="text-[10px]" style="font-size: 10px;">Date: 24/10/2023</div>
    <div class="text-[10px]" style="font-size: 10px;">Cust: John Doe</div>
    <div class="dashed-line" style="border-top: 1px dashed #000; margin: 8px 0; opacity: 0.7;"></div>
    <div class="text-[10px]" style="font-size: 10px;">Shalwar Kameez × 2</div>
    <div class="text-[10px]" style="font-size: 10px;">Wash & Wear</div>
    <div class="dashed-line" style="border-top: 1px dashed #000; margin: 8px 0; opacity: 0.7;"></div>
    <div class="flex justify-between text-[10px] font-bold" style="display: flex; justify-content: space-between; font-size: 10px; font-weight: bold;"><span>Total:</span><span>Rs 3,000</span></div>
    <div class="flex justify-between text-[10px]" style="display: flex; justify-content: space-between; font-size: 10px;"><span>Advance:</span><span>Rs 1,000</span></div>
    <div class="flex justify-between text-[10px] font-bold" style="display: flex; justify-content: space-between; font-size: 10px; font-weight: bold;"><span>Baqi:</span><span>Rs 2,000</span></div>
    <div class="dashed-line" style="border-top: 1px dashed #000; margin: 8px 0; opacity: 0.7;"></div>
    <div class="text-center text-[10px]" style="text-align: center; font-size: 10px;">Delivery: 05/11/2023</div>
    <div class="mt-4 text-center text-[10px] font-bold" style="margin-top: 16px; text-align: center; font-size: 10px; font-weight: bold;">*** SHUKRIYA ***</div>
    <div class="mt-2 flex justify-center" style="margin-top: 8px; display: flex; justify-content: center;">
        <div class="barcode-container" style="display: flex; align-items: flex-end; justify-content: center; height: 40px; gap: 1px; background: white; padding: 4px;">
            <div class="barcode-bar wide" style="background: #000; height: 100%; width: 4px;"></div>
            <div style="width: 2px; height: 100%; background: transparent;"></div>
            <div class="barcode-bar" style="background: #000; width: 2px; height: 100%;"></div>
            <div style="width: 4px; height: 100%; background: transparent;"></div>
            <div class="barcode-bar wide" style="background: #000; height: 100%; width: 4px;"></div>
        </div>
    </div>
    <div class="text-center text-[8px] mt-1" style="text-align: center; font-size: 8px; margin-top: 4px;">*ORD-1001*</div>
</div>

</body>
</html>
